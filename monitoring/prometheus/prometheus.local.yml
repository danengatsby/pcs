global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/alerts.pcs.yml

scrape_configs:
  - job_name: pcs-api-local
    scheme: http
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/pcs_metrics_bearer_token
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          service: pcs-api
          environment: local
